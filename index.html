<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M22C - Web Multi-Encryption Security Tool</title>
    <!-- Tailwind CSS per un'interfaccia moderna e pulita -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip per la gestione dei container .m22c senza dipendere da 7-Zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

    <div class="max-w-3xl w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8">
        <!-- Intestazione -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-emerald-400">M22C SECURE SUITE</h1>
            <p class="text-sm text-slate-400 mt-1">Sistema di Multi-Cifratura Avanzata & Frammentazione Ricorsiva 4x4x4</p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="btnTabCripta" onclick="switchTab('cripta')" class="flex-1 py-3 font-semibold text-center border-b-2 border-emerald-400 text-emerald-400 transition">Cifratura & Protezione</button>
            <button id="btnTabDecripta" onclick="switchTab('decripta')" class="flex-1 py-3 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Decifratura & Ripristino</button>
        </div>

        <!-- ================= SEZIONE CIFRATURA ================= -->
        <div id="sectionCripta" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">1. Seleziona il file da proteggere:</label>
                <input type="file" id="inputFile" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer bg-slate-900 border border-slate-700 rounded-xl p-2">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 1 (Step 1)</label>
                    <input type="password" id="pass1" value="123" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 2 (Step 2)</label>
                    <input type="password" id="pass2" value="456" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 3 (Step 3)</label>
                    <input type="password" id="pass3" value="789" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Stile Nomi Contenitori:</label>
                <select id="namingStyle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
                    <option value="random">Casuali (es. nvidia_driver, steam_lib, fifa2010)</option>
                    <option value="ordered">Ordinati (gs-01, gs-02, gs-03)</option>
                </select>
            </div>

            <button onclick="eseguiCifratura()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                Avvia Pipeline di Cifratura & Genera Container .m22c
            </button>
        </div>

        <!-- ================= SEZIONE DECIFRATURA ================= -->
        <div id="sectionDecripta" class="space-y-5 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">1. Seleziona i 3 file contenitori (.m22c):</label>
                <input type="file" id="inputContainers" multiple accept=".m22c,.zip" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer bg-slate-900 border border-slate-700 rounded-xl p-2">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 1</label>
                    <input type="password" id="dPass1" value="123" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 2</label>
                    <input type="password" id="dPass2" value="456" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password 3</label>
                    <input type="password" id="dPass3" value="789" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <button onclick="eseguiDecifratura()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                Estrai Contenitori & Ripristina File Originale
            </button>
        </div>

        <!-- Progress bar & Log -->
        <div class="mt-8 space-y-3">
            <div class="w-full bg-slate-900 rounded-full h-4 overflow-hidden border border-slate-700">
                <div id="progressBar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
            </div>
            <div id="statusLog" class="bg-slate-950 font-mono text-xs text-slate-400 p-3 rounded-xl h-28 overflow-y-auto border border-slate-800">
                Pronto per l'elaborazione...
            </div>
        </div>
    </div>

    <!-- JavaScript Logica Core M22C -->
    <script>
        const PASS_MANIFEST = "IyT#kFfn@I6rHF3j_Secure_Key_2026";

        function switchTab(tab) {
            const secC = document.getElementById('sectionCripta');
            const secD = document.getElementById('sectionDecripta');
            const btnC = document.getElementById('btnTabCripta');
            const btnD = document.getElementById('btnTabDecripta');

            if (tab === 'cripta') {
                secC.classList.remove('hidden');
                secD.classList.add('hidden');
                btnC.className = "flex-1 py-3 font-semibold text-center border-b-2 border-emerald-400 text-emerald-400 transition";
                btnD.className = "flex-1 py-3 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            } else {
                secC.classList.add('hidden');
                secD.classList.remove('hidden');
                btnD.className = "flex-1 py-3 font-semibold text-center border-b-2 border-cyan-400 text-cyan-400 transition";
                btnC.className = "flex-1 py-3 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            }
        }

        function log(msg) {
            const box = document.getElementById('statusLog');
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function setProgress(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // --- Algoritmo Hash & Trasformazione (Porting esatto dal VBA) ---
        function generaChiaveHash(password, salt) {
            let passBytes = new TextEncoder().encode(password + "_M22_Salt_" + salt);
            let hashOut = new Uint8Array(32);
            let pLen = passBytes.length;

            for (let i = 0; i < 32; i++) {
                hashOut[i] = (passBytes[i % pLen] + salt + (i * 37)) % 256;
            }

            for (let round = 1; round <= 4; round++) {
                let accum = hashOut[0];
                for (let i = 0; i < 32; i++) {
                    accum = accum ^ hashOut[i] ^ passBytes[(i + round) % pLen];
                    hashOut[i] = (accum + i) % 256;
                }
            }
            return hashOut;
        }

        function trasformaDatiAvanzata(datiBytes, password, livello) {
            if (!datiBytes || datiBytes.length === 0) return datiBytes;
            let keyBytes = generaChiaveHash(password, livello);
            let res = new Uint8Array(datiBytes.length);
            let rollingVal = keyBytes[0] + livello;

            for (let i = 0; i < datiBytes.length; i++) {
                rollingVal = (rollingVal + keyBytes[i % 32] + (i % 255)) % 256;
                res[i] = datiBytes[i] ^ keyBytes[i % 32] ^ rollingVal;
            }
            return res;
        }

        function dividiInQuattro(dati) {
            let totalLen = dati.length;
            let qSize = Math.floor(totalLen / 4);
            let remSize = totalLen % 4;
            let l1 = qSize + (remSize > 0 ? 1 : 0);
            let l2 = qSize + (remSize > 1 ? 1 : 0);
            let l3 = qSize + (remSize > 2 ? 1 : 0);
            let l4 = totalLen - (l1 + l2 + l3);

            let p1 = dati.subarray(0, l1);
            let p2 = dati.subarray(l1, l1 + l2);
            let p3 = dati.subarray(l1 + l2, l1 + l2 + l3);
            let p4 = dati.subarray(l1 + l2 + l3, totalLen);
            return [p1, p2, p3, p4];
        }

        function unisciQuattro(b1, b2, b3, b4) {
            let tLen = b1.length + b2.length + b3.length + b4.length;
            let res = new Uint8Array(tLen);
            let offset = 0;
            res.set(b1, offset); offset += b1.length;
            res.set(b2, offset); offset += b2.length;
            res.set(b3, offset); offset += b3.length;
            res.set(b4, offset);
            return res;
        }

        // --- PIPELINE DI CIFRATURA ---
        async function eseguiCifratura() {
            const fileInput = document.getElementById('inputFile');
            if (fileInput.files.length === 0) {
                alert("Seleziona prima un file da criptare!");
                return;
            }

            const file = fileInput.files[0];
            const p1 = document.getElementById('pass1').value || "123";
            const p2 = document.getElementById('pass2').value || "456";
            const p3 = document.getElementById('pass3').value || "789";
            const namingStyle = document.getElementById('namingStyle').value;

            log("Lettura file binario in corso...");
            setProgress(5);

            const arrayBuffer = await file.arrayBuffer();
            const rawData = new Uint8Array(arrayBuffer);

            // Iniezione header M22X
            const header = new TextEncoder().encode("M22X");
            let datiOrig = new Uint8Array(header.length + rawData.length);
            datiOrig.set(header, 0);
            datiOrig.set(rawData, header.length);

            log("Applicazione passate di trasformazione e frammentazione 64 blocchi...");
            setProgress(20);

            let d1 = trasformaDatiAvanzata(datiOrig, p1, 1);
            let [s1_1, s1_2, s1_3, s1_4] = dividiInQuattro(d1);
            let arrS2 = [s1_1, s1_2, s1_3, s1_4];

            let arrS4 = new Array(64);
            let frammentiMap = {};
            let count64 = 0;

            let prefixChars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let prefisso = "";
            for(let i=0; i<4; i++) prefisso += prefixChars[Math.floor(Math.random() * prefixChars.length)];

            for (let i = 0; i < 4; i++) {
                let tmp2 = trasformaDatiAvanzata(arrS2[i], p2, 2);
                let [p2_1, p2_2, p2_3, p2_4] = dividiInQuattro(tmp2);
                let arrP2 = [p2_1, p2_2, p2_3, p2_4];

                for (let j = 0; j < 4; j++) {
                    let tmp3 = trasformaDatiAvanzata(arrP2[j], p3, 3);
                    let [p3_1, p3_2, p3_3, p3_4] = dividiInQuattro(tmp3);
                    let arrP3 = [p3_1, p3_2, p3_3, p3_4];

                    for (let k = 0; k < 4; k++) {
                        count64++;
                        let rName = `sec_${prefisso}_${String(count64).padStart(2, '0')}.bin`;
                        arrS4[count64 - 1] = rName;
                        frammentiMap[rName] = arrP3[k];
                    }
                }
            }

            setProgress(50);
            log("Generazione file manifesto e cifratura Master Key...");
            let manifestText = file.name + "\n" + arrS4.join("\n") + "\n";
            let manifestBytes = new TextEncoder().encode(manifestText);
            let encManifest = trasformaDatiAvanzata(manifestBytes, PASS_MANIFEST, 99);
            frammentiMap["manifest_tree.dat"] = encManifest;

            // Suddivisione in 3 gruppi di container .m22c
            log("Creazione dei 3 archivi container .m22c protetti...");
            setProgress(70);

            let allKeys = Object.keys(frammentiMap);
            // Mescola casualmente
            allKeys.sort(() => Math.random() - 0.5);

            let gruppi = [[], [], []];
            allKeys.forEach((key, index) => {
                gruppi[index % 3].push(key);
            });

            let nomiArchivi = namingStyle === 'random' ? 
                ['nvidia_driver.m22c', 'steam_lib.m22c', 'fifa2010.m22c'] : 
                ['gs-01.m22c', 'gs-02.m22c', 'gs-03.m22c'];

            for (let g = 0; g < 3; g++) {
                let zip = new JSZip();
                gruppi[g].forEach(fname => {
                    zip.file(fname, frammentiMap[fname]);
                });

                // Genera zip con protezione password (simulata tramite zip standard o generata come blob)
                let content = await zip.generateAsync({
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: { level: 6 }
                });

                // Download automatico dei 3 file contenitori
                let link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = nomiArchivi[g];
                link.click();
            }

            setProgress(100);
            log("COMPLETATO! I 3 file container .m22c sono stati scaricati sul tuo PC.");
        }

        // --- PIPELINE DI DECIFRATURA ---
        async function eseguiDecifratura() {
            const containerInput = document.getElementById('inputContainers');
            if (containerInput.files.length === 0) {
                alert("Seleziona i file .m22c generati in precedenza!");
                return;
            }

            const p1 = document.getElementById('dPass1').value || "123";
            const p2 = document.getElementById('dPass2').value || "456";
            const p3 = document.getElementById('dPass3').value || "789";

            log("Estrazione file dai container .m22c...");
            setProgress(20);

            let extractedFiles = {};

            for (let file of containerInput.files) {
                try {
                    let zip = new JSZip();
                    let zipContent = await zip.loadAsync(file);
                    for (let filename of Object.keys(zipContent.files)) {
                        if (!zipContent.files[filename].dir) {
                            let contentBytes = await zipContent.files[filename].async("uint8array");
                            extractedFiles[filename] = contentBytes;
                        }
                    }
                } catch (e) {
                    log("Errore lettura archivio: " + file.name);
                }
            }

            if (!extractedFiles["manifest_tree.dat"]) {
                alert("Errore critico: Manifesto non trovato nei container! Password o file errati.");
                return;
            }

            setProgress(50);
            log("Decifratura manifesto e lettura struttura frammenti...");
            let encManifest = extractedFiles["manifest_tree.dat"];
            let decManifestBytes = trasformaDatiAvanzata(encManifest, PASS_MANIFEST, 99);
            let manifestText = new TextDecoder().decode(decManifestBytes);
            let lines = manifestText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

            let origName = lines[0];
            let fNames = lines.slice(1, 65);

            if (fNames.length < 64) {
                alert("Errore: Il manifesto non contiene tutti i 64 frammenti.");
                return;
            }

            setProgress(70);
            log("Ricomposizione geometrica 4x4x4 inversa...");
            let arrS3 = new Array(16);
            let c = 0;
            for (let i = 0; i < 16; i++) {
                let b1 = extractedFiles[fNames[c++]];
                let b2 = extractedFiles[fNames[c++]];
                let b3 = extractedFiles[fNames[c++]];
                let b4 = extractedFiles[fNames[c++]];
                let merged3 = unisciQuattro(b1, b2, b3, b4);
                arrS3[i] = trasformaDatiAvanzata(merged3, p3, 3);
            }

            let arrS2 = new Array(4);
            c = 0;
            for (let i = 0; i < 4; i++) {
                let m2 = unisciQuattro(arrS3[c++], arrS3[c++], arrS3[c++], arrS3[c++]);
                arrS2[i] = trasformaDatiAvanzata(m2, p2, 2);
            }

            let finalMerged = unisciQuattro(arrS2[0], arrS2[1], arrS2[2], arrS2[3]);
            let decryptedWithHeader = trasformaDatiAvanzata(finalMerged, p1, 1);

            // Verifica firma M22X
            let headerCheck = String.fromCharCode(decryptedWithHeader[0], decryptedWithHeader[1], decryptedWithHeader[2], decryptedWithHeader[3]);
            if (headerCheck !== "M22X") {
                alert("ATTENZIONE: Password interne (1, 2 o 3) errate oppure file corrotti!");
                setProgress(0);
                return;
            }

            let originalData = decryptedWithHeader.subarray(4);

            setProgress(100);
            log("File ripristinato con successo: RIP_" + origName);

            // Download file finale
            let blob = new Blob([originalData]);
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "RIP_" + origName;
            link.click();

            alert("File ripristinato e scaricato con successo!");
        }
    </script>
</body>
</html>
